services:
  backend:
    image: python:3.12-slim
    container_name: redbook-backend
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=https://api.xiaomimimo.com/v1
      - LLM_MODEL=mimo-v2-omni
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped
    command: bash -c "pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: nginx:alpine
    container_name: redbook-frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
