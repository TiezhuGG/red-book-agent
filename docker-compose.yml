version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redbook-backend
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.xiaomimimo.com/v1}
      - LLM_MODEL=${LLM_MODEL:-mimo-v2-omni}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BACKEND_PORT=8000
      - CDN_UPLOAD_URL=${CDN_UPLOAD_URL}
      - CDN_UPLOAD_FIELD=${CDN_UPLOAD_FIELD:-file}
      - OPENAI_WHISPER_BASE_URL=${OPENAI_WHISPER_BASE_URL}
      - OPENAI_WHISPER_API_KEY=${OPENAI_WHISPER_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    networks:
      - redbook-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: redbook-frontend
    ports:
      - "127.0.0.1:8100:80"
    depends_on:
      - backend
    networks:
      - redbook-network
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: redbook-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - redbook-network
    restart: unless-stopped

networks:
  redbook-network:
    driver: bridge
